name: Endgame piece-square compatibility

on:
  pull_request:
    paths:
      - 'model/**'
      - 'data_loader/**'
      - 'tests/test_endgame.py'
      - 'tests/test_training_pipeline_run.py'
      - 'scripts/test_endgame.sh'
      - '.github/workflows/endgame.yml'
  push:
    branches: [experiment/endgame-psq]

jobs:
  endgame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.CPU
          push: false
          load: true
          tags: nnue-pytorch:cpu
          cache-from: type=gha,scope=cpu-cache
          cache-to: type=gha,mode=max,scope=cpu-cache
      - name: Checkout pinned experimental engine
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TonyCongqianWang/Stockfish
          ref: 6597105d0b8525179ad95f2bbc7b4f29bd45e866
          path: Stockfish
          persist-credentials: false
      - name: Endgame correctness, short training, and engine compatibility
        run: |
          ./run_docker.sh CPU . --skip-build --non-interactive --exec \
            bash scripts/test_endgame.sh
