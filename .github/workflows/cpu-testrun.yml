name: CPU Testrun

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Match the engine's NNUE_TEST_SMALL build. Adapter/codebook dimensions are
# training-only; the coalesced inference net has four FC0 and four tail experts.
env:
  SMALL_MODEL: >-
    --l1=256 --moe-fc0-experts=4 --moe-tail-experts=4
    --moe-fc0-codebook-dim=8 --moe-tail-codebook-dim=8
    --moe-fc0-rank=4 --moe-tail-rank=4

jobs:
  train-and-cross-check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and load CPU Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.CPU
          push: false
          load: true
          tags: nnue-pytorch:cpu
          cache-from: type=gha,scope=cpu-cache
          cache-to: type=gha,mode=max,scope=cpu-cache

      - name: Checkout Stockfish
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TonyCongqianWang/Stockfish
          ref: e929ec64789642ad5e6de1b0998693d91d7b7c28
          path: Stockfish
          persist-credentials: false

      - name: Compile Compatible Stockfish
        run: |
          cd Stockfish/src
          make -j2 build ARCH=x86-64-avx2 EXTRACXXFLAGS=-DNNUE_TEST_SMALL

      - name: Perform Test Run of entire Training Pipeline on CPU
        run: |
          ./run_docker.sh CPU ${{ github.workspace }} --skip-build --non-interactive --exec \
            env OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -u tests/test_training_pipeline_run.py \
            -y --device cpu --num_workers 1 --batch-size 32 --epoch-size 256 --validation-size 128 --ft-optimize-count 128 \
            $SMALL_MODEL --test-dir /data/logs/training/runs/unittests_train_pipeline_cpu

      - name: Perform Cross-Check Evaluation
        run: |
          ./run_docker.sh CPU ${{ github.workspace }} --skip-build --skip-setup --non-interactive --exec \
            env OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -u cross_check_eval.py \
            --net /data/logs/training/runs/unittests_train_pipeline_cpu/training_logs/version_2/checkpoints/last.nnue \
            --data .pgo/small.binpack --engine ./Stockfish/src/stockfish --device=cpu --count 512 $SMALL_MODEL \
            --max-error 2 --max-ckpt-error 0 \
            --checkpoint /data/logs/training/runs/unittests_train_pipeline_cpu/training_logs/version_2/checkpoints/last.ckpt

  cross-check-random:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build and load CPU Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile.CPU
          push: false
          load: true
          tags: nnue-pytorch:cpu
          cache-from: type=gha,scope=cpu-cache
          cache-to: type=gha,mode=max,scope=cpu-cache

      - name: Checkout Stockfish
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: TonyCongqianWang/Stockfish
          ref: e929ec64789642ad5e6de1b0998693d91d7b7c28
          path: Stockfish
          persist-credentials: false

      - name: Compile Compatible Stockfish
        run: |
          cd Stockfish/src
          make -j2 build ARCH=x86-64-avx2 EXTRACXXFLAGS=-DNNUE_TEST_SMALL

      - name: Perform MoE CPU Checks
        run: |
          ./run_docker.sh CPU ${{ github.workspace }} --skip-build --non-interactive --exec \
            env OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -m pytest tests/test_model_cli.py tests/test_moe_architecture.py tests/test_final_validation.py tests/test_moe_routing.py tests/test_routing_contexts.py tests/test_moe_load_balancing.py -q

      - name: Perform Cross-Check Evaluation on Random Net
        run: |
          ./run_docker.sh CPU ${{ github.workspace }} --skip-build --non-interactive --exec \
            env OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 python -u cross_check_eval.py --random-weights \
            --data .pgo/small.binpack --engine ./Stockfish/src/stockfish --device=cpu \
            --count 512 --seed 42 --max-error 2 --max-ckpt-error 0 $SMALL_MODEL
